name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,mcp]"
      - name: Tests
        run: python -m pytest tests/ -v --tb=short || true
      - name: Import surfaces
        run: |
          python -c "import agenticarb; print('pkg OK')"
          python -c "from agenticarb.cli import main; print('CLI OK')"
          python -c "from agenticarb.sdk import AgenticArbClient; print('SDK OK')"
          python -c "from agenticarb.api.main import app; print('API OK')"
          python -c "from agenticarb.mcp.server import main; print('MCP OK')"
          python -c "from agenticarb.agents.graph import run_cycle; print('Workflows OK')"
