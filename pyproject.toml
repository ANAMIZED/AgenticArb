[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticarb"
version = "2.0.0"
description = "Open-Source Autonomous Agentic Operating System for RWA Perpetual Funding-Rate Carry Strategies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgenticArb Contributors" }]
keywords = ["hyperliquid", "funding-rate", "rwa", "perpetuals", "agentic", "quant", "carry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
live = ["hyperliquid-python-sdk>=0.1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
api = ["fastapi", "uvicorn", "httpx"]
mcp = ["mcp"]

[project.scripts]
agenticarb = "agenticarb.cli:main"
agenticarb-api = "agenticarb.api.main:run"
agenticarb-mcp = "agenticarb.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
